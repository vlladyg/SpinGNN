model:
  _target_: allegro.model.AllegroModel
  seed: 456
  model_dtype: float32
  type_names:
  - Si
  r_max: 5.0
  scalar_embed:
    _target_: allegro.nn.TwoBodyBesselScalarEmbed
    num_bessels: 8
    bessel_trainable: false
    polynomial_cutoff_p: 6
    two_body_embedding_dim: 32
    two_body_mlp_hidden_layers_depth: 2
    two_body_mlp_hidden_layers_width: 64
    two_body_mlp_nonlinearity: silu
  l_max: 1
  parity_setting: o3_full
  num_layers: 2
  num_scalar_features: 64
  num_tensor_features: 32
  tp_path_channel_coupling: false
  allegro_mlp_hidden_layers_depth: 2
  allegro_mlp_hidden_layers_width: 128
  allegro_mlp_nonlinearity: silu
  readout_mlp_hidden_layers_depth: 1
  readout_mlp_hidden_layers_width: 32
  readout_mlp_nonlinearity: null
  avg_num_neighbors: 28.01278409090909
  per_type_energy_shifts: -129.95990006072915
  per_type_energy_scales: 0.9103881956399772
  per_type_energy_scales_trainable: false
  per_type_energy_shifts_trainable: false
  pair_potential:
    _target_: nequip.nn.pair_potential.ZBL
    units: real
    chemical_species:
    - Si
optimizer:
  _target_: torch.optim.Adam
  lr: 0.001
lr_scheduler: null
loss:
  _target_: nequip.train.EnergyForceLoss
  per_atom_energy: true
  coeffs:
    total_energy: 1.0
    forces: 1.0
train_metrics: null
val_metrics:
  _target_: nequip.train.EnergyForceMetrics
  coeffs:
    per_atom_energy_mae: 1.0
    forces_mae: 1.0
test_metrics:
  _target_: nequip.train.EnergyForceMetrics
  coeffs:
    per_atom_energy_mae: 1.0
    forces_mae: 1.0
num_datasets:
  train: 1
  val: 1
  test: 1
  predict: 0
info_dict:
  versions:
    torch: 2.6.0a0+git1eba9b3
    e3nn: 0.5.6
    nequip: 0.7.0
    allegro: 0.4.0
  data:
    _target_: nequip.data.datamodule.ASEDataModule
    seed: 456
    split_dataset:
      file_path: ./sitraj.xyz
      train: 0.8
      val: 0.1
      test: 0.1
    transforms:
    - _target_: nequip.data.transforms.NeighborListTransform
      r_max: 5.0
    - _target_: nequip.data.transforms.ChemicalSpeciesToAtomTypeMapper
      chemical_symbols:
      - Si
    train_dataloader:
      _target_: torch.utils.data.DataLoader
      batch_size: 5
      num_workers: 5
      shuffle: true
    val_dataloader:
      _target_: torch.utils.data.DataLoader
      batch_size: 10
      num_workers: 5
    test_dataloader:
      _target_: torch.utils.data.DataLoader
      batch_size: 10
      num_workers: 5
    stats_manager:
      _target_: nequip.data.CommonDataStatisticsManager
      dataloader_kwargs:
        batch_size: 10
      type_names:
      - Si
  trainer:
    _target_: lightning.Trainer
    max_epochs: 5
    check_val_every_n_epoch: 1
    log_every_n_steps: 5
    callbacks:
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      dirpath: /pscratch/sd/v/vladygin/nequip-allegro-lammps/test_allegro/outputs/2025-05-01/17-10-06
      save_last: true
  global_options:
    allow_tf32: false
  runs:
  - train
  - test
  training_module:
    _target_: nequip.train.EMALightningModule
    loss:
      _target_: nequip.train.EnergyForceLoss
      per_atom_energy: true
      coeffs:
        total_energy: 1.0
        forces: 1.0
    val_metrics:
      _target_: nequip.train.EnergyForceMetrics
      coeffs:
        per_atom_energy_mae: 1.0
        forces_mae: 1.0
    test_metrics:
      _target_: nequip.train.EnergyForceMetrics
      coeffs:
        per_atom_energy_mae: 1.0
        forces_mae: 1.0
    optimizer:
      _target_: torch.optim.Adam
      lr: 0.001
    model:
      _target_: allegro.model.AllegroModel
      seed: 456
      model_dtype: float32
      type_names:
      - Si
      r_max: 5.0
      scalar_embed:
        _target_: allegro.nn.TwoBodyBesselScalarEmbed
        num_bessels: 8
        bessel_trainable: false
        polynomial_cutoff_p: 6
        two_body_embedding_dim: 32
        two_body_mlp_hidden_layers_depth: 2
        two_body_mlp_hidden_layers_width: 64
        two_body_mlp_nonlinearity: silu
      l_max: 1
      parity_setting: o3_full
      num_layers: 2
      num_scalar_features: 64
      num_tensor_features: 32
      tp_path_channel_coupling: false
      allegro_mlp_hidden_layers_depth: 2
      allegro_mlp_hidden_layers_width: 128
      allegro_mlp_nonlinearity: silu
      readout_mlp_hidden_layers_depth: 1
      readout_mlp_hidden_layers_width: 32
      readout_mlp_nonlinearity: null
      avg_num_neighbors: 28.01278409090909
      per_type_energy_shifts: -129.95990006072915
      per_type_energy_scales: 0.9103881956399772
      per_type_energy_scales_trainable: false
      per_type_energy_shifts_trainable: false
      pair_potential:
        _target_: nequip.nn.pair_potential.ZBL
        units: real
        chemical_species:
        - Si
ema_decay: 0.999
