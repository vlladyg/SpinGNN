# yamllint disable rule:line-length
# Training configuration for small Allegro model on NbMoTaW dataset

run: [train, test]

# === Model and data parameters ===
cutoff_radius: 5.0
chemical_symbols: [Nb, Mo, Ta, W]
model_type_names: ${chemical_symbols}

# === Small model hyperparameters for fast training ===
num_scalar_features: 32      # small number of scalar features for fast training
num_tensor_features: 16      # small number of tensor features

# ============
#     DATA
# ============
data:
  _target_: nequip.data.datamodule.ASEDataModule
  seed: 456             # dataset seed for reproducibility

  # Split the dataset: 80% train, 10% val, 10% test
  split_dataset:
    file_path: benchmark_data/NbMoTaW.xyz
    train: 0.8
    val: 0.1
    test: 0.1

  # Data transforms
  transforms:
    # Map chemical species to atom types
    - _target_: nequip.data.transforms.ChemicalSpeciesToAtomTypeMapper
      chemical_symbols: ${chemical_symbols}
    # Build neighborlist
    - _target_: nequip.data.transforms.NeighborListTransform
      r_max: ${cutoff_radius}

  # DataLoader configurations
  train_dataloader:
    _target_: torch.utils.data.DataLoader
    batch_size: 5
    num_workers: 4
    shuffle: true
  val_dataloader:
    _target_: torch.utils.data.DataLoader
    batch_size: 10
    num_workers: 4
  test_dataloader: ${data.val_dataloader}

  # Dataset statistics manager
  stats_manager:
    _target_: nequip.data.CommonDataStatisticsManager
    dataloader_kwargs:
      batch_size: 10
    type_names: ${model_type_names}


# =============
#    TRAINER
# =============
trainer:
  _target_: lightning.Trainer
  accelerator: auto
  enable_checkpointing: true
  max_epochs: 10
  log_every_n_steps: 10

  # Use any Lightning supported logger
  logger:
    _target_: lightning.pytorch.loggers.CSVLogger
    save_dir: ${hydra:runtime.output_dir}
    name: allegro_nbmotaw

  # Lightning callbacks
  callbacks:
    # Early stopping
    - _target_: lightning.pytorch.callbacks.EarlyStopping
      monitor: val0_epoch/forces_mae
      min_delta: 1e-4
      patience: 15

    # Model checkpointing
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      monitor: val0_epoch/forces_mae
      dirpath: ${hydra:runtime.output_dir}
      filename: best
      save_last: true

    # Learning rate monitor
    - _target_: lightning.pytorch.callbacks.LearningRateMonitor
      logging_interval: epoch


# =====================
#    TRAINING MODULE
# =====================
training_module:
  _target_: nequip.train.EMALightningModule

  # EMA decay parameter
  ema_decay: 0.99

  # Loss function
  loss:
    _target_: nequip.train.EnergyForceLoss
    per_atom_energy: true
    coeffs:
      total_energy: 1.0
      forces: 1.0

  # Validation and test metrics
  val_metrics:
    _target_: nequip.train.EnergyForceMetrics
    coeffs:
      per_atom_energy_mae: 1.0
      forces_mae: 1.0
  test_metrics: ${training_module.val_metrics}

  # Optimizer - Allegro works well with lr around 1e-3
  optimizer:
    _target_: torch.optim.Adam
    lr: 0.001

  # Learning rate scheduler
  lr_scheduler:
    scheduler:
      _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
      factor: 0.8
      patience: 5
      min_lr: 1e-6
    monitor: val0_epoch/forces_mae
    interval: epoch
    frequency: 1

  # === Allegro Model ===
  model:
    _target_: allegro.model.AllegroModel

    # Basic model parameters
    seed: 456
    model_dtype: float32
    type_names: ${model_type_names}
    r_max: ${cutoff_radius}

    # === Two-body scalar embedding ===
    radial_chemical_embed:
      _target_: allegro.nn.TwoBodyBesselScalarEmbed
      num_bessels: 8
      bessel_trainable: false
      polynomial_cutoff_p: 6

    # Output dimension of the radial-chemical embedding
    radial_chemical_embed_dim: ${num_scalar_features}

    # Scalar embedding MLP
    scalar_embed_mlp_hidden_layers_depth: 1
    scalar_embed_mlp_hidden_layers_width: ${num_scalar_features}
    scalar_embed_mlp_nonlinearity: silu

    # === Core hyperparameters (small model for fast training) ===
    l_max: 1                                    # spherical harmonics order (1=fast, 2=accurate)
    num_layers: 2                               # number of tensor product layers
    num_scalar_features: ${num_scalar_features} # number of scalar features
    num_tensor_features: ${num_tensor_features} # number of tensor features

    # === Allegro MLPs ===
    allegro_mlp_hidden_layers_depth: 1
    allegro_mlp_hidden_layers_width: ${num_scalar_features}
    allegro_mlp_nonlinearity: silu

    # === Advanced hyperparameters ===
    parity: true                            # include odd mirror parity features
    tp_path_channel_coupling: true          # couple paths and channels in tensor product

    # === Readout MLP ===
    readout_mlp_hidden_layers_depth: 1
    readout_mlp_hidden_layers_width: ${num_scalar_features}
    readout_mlp_nonlinearity: silu

    # === Normalization and scaling ===
    avg_num_neighbors: ${training_data_stats:num_neighbors_mean}
    per_type_energy_shifts: ${training_data_stats:per_atom_energy_mean}
    per_type_energy_scales: ${training_data_stats:forces_rms}
    per_type_energy_scales_trainable: false
    per_type_energy_shifts_trainable: false


# Global options
global_options:
  allow_tf32: false

